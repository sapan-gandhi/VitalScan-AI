services:
  - type: web
    name: vitalscan-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
    autoDeploy: true
